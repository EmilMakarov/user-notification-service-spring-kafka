server:
  port: 8081
spring:
  application:
    name: user-notification-service-spring-kafka
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "org.example.usernotificationservicespringkafka.event,org.example.userservicespring.event"
        spring.json.type.mapping: org.example.userservicespring.event.UserEvent:org.example.usernotificationservicespringkafka.event.UserEvent
  mongodb:
    uri: mongodb://localhost:27017/notificationdb
  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-app-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
app:
  kafka:
    topic:
      user-events: user-events
resilience4j:
  circuitbreaker:
    instances:
      emailService:
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka