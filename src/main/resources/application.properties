spring.application.name=user-notification-service-spring-kafka
server.port=8081

spring.mongodb.uri=mongodb://mongo:mongo@localhost:27017/notificationdb?authSource=admin

spring.kafka.bootstrap-servers=localhost:9092
app.kafka.topic.user-events=user-events

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAUL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
logging.level.org.example.notificationservice=DEBUG