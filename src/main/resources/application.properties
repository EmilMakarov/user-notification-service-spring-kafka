spring.application.name=user-notification-service-spring-kafka
server.port=8081

spring.mongodb.host=localhost
spring.mongodb.port=
spring.mongodb.database=notifications

spring.kafka.bootstrap-servers=localhost:
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.mail.host=smtp.gmail.com
spring.mail.port=
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
logging.level.org.example.notificationservice=DEBUG